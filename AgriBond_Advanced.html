<title>AgriBond</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400..700&display=swap">
<style>
/* Layout: responsive web app. Sticky top bar + main column with a 340px rail on desktop; bottom tab bar on phones. */
:root{
  --paper:#f2f5ed;--surface:#ffffff;--raised:#f8faf4;--ink:#16261b;--ink2:#41564a;--muted:#6a7d6f;--hair:#dbe3d5;
  --brand:#2b6a39;--brand-d:#1d4a28;--brand-t:#e0eede;--on-brand:#ffffff;
  --wheat:#bf8318;--wheat-t:#fbf0d7;
  --ok:#1d8749;--ok-t:#e0f2e7;--warn:#a5620e;--warn-t:#fbeed6;--bad:#af3838;--bad-t:#fbe7e7;--info:#27608a;--info-t:#e1edf6;
  --hero:#1c3f26;--hero-ink:#eef5ea;--hero-mute:#b8cfbb;
  --shadow:0 1px 2px rgba(22,38,27,.06),0 3px 16px rgba(22,38,27,.05);
  --fd:"Bricolage Grotesque",Georgia,"Times New Roman",serif;
  --fb:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1610;--surface:#162019;--raised:#1b271e;--ink:#e6efe7;--ink2:#b3c4b7;--muted:#8a9e8f;--hair:#293829;
  --brand:#74c180;--brand-d:#9bd6a5;--brand-t:#1c3322;--on-brand:#0e1610;
  --wheat:#e2a840;--wheat-t:#3a2d12;
  --ok:#5fcb89;--ok-t:#16301f;--warn:#e8a755;--warn-t:#3a2c12;--bad:#f08c8c;--bad-t:#3b1c1c;--info:#7fb8e1;--info-t:#162b3a;
  --hero:#12291a;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1610;--surface:#162019;--raised:#1b271e;--ink:#e6efe7;--ink2:#b3c4b7;--muted:#8a9e8f;--hair:#293829;
  --brand:#74c180;--brand-d:#9bd6a5;--brand-t:#1c3322;--on-brand:#0e1610;
  --wheat:#e2a840;--wheat-t:#3a2d12;
  --ok:#5fcb89;--ok-t:#16301f;--warn:#e8a755;--warn-t:#3a2c12;--bad:#f08c8c;--bad-t:#3b1c1c;--info:#7fb8e1;--info-t:#162b3a;
  --hero:#12291a;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
h1,h2,h3,h4{font-family:var(--fd);font-weight:650;margin:0 0 .4em;color:var(--ink);letter-spacing:-.01em;text-wrap:balance}
h2{font-size:17px}h3{font-size:15px}
p{margin:0 0 .6em}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;width:100%}
.mono{font-family:var(--mono);font-size:12.5px}
.mute{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.eyebrow{font-size:12px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:60}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--hair);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.tb{display:flex;align-items:center;gap:18px;height:58px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:750;font-size:19px;text-decoration:none;color:var(--brand-d)}
.brand svg{width:24px;height:24px;color:var(--brand)}
.tnav{display:flex;gap:2px;flex:1}
.tnav a{padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:550;color:var(--ink2);font-size:14.5px}
.tnav a:hover{background:var(--raised)}
.tnav a.on{background:var(--brand-t);color:var(--brand-d)}
.tb-r{display:flex;align-items:center;gap:10px;margin-left:auto}
.planpill{font-size:12px;font-weight:650;padding:3px 10px;border-radius:99px;text-decoration:none;background:var(--raised);border:1px solid var(--hair);color:var(--ink2)}
.planpill.pro{background:var(--wheat-t);color:var(--wheat);border-color:transparent}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--hair);border-radius:99px;padding:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--brand);color:var(--on-brand)}
.iconbtn{position:relative;width:36px;height:36px;border-radius:50%;border:1px solid var(--hair);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.iconbtn:hover{background:var(--raised)}
.iconbtn svg,.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn i{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-style:normal;font-weight:700;display:grid;place-items:center;padding:0 4px}
.avatar{width:36px;height:36px;border-radius:50%;border:0;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:13px;cursor:pointer}
.pop-wrap{position:relative}
.pop{position:absolute;right:0;top:44px;width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--hair);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.18);z-index:70;overflow:hidden}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--hair);font-weight:650}
.pop-i{display:block;padding:11px 14px;border-bottom:1px solid var(--hair);text-decoration:none;font-size:13.5px;cursor:pointer}
.pop-i:last-child{border:0}.pop-i:hover{background:var(--raised)}
.pop-i.unread{background:var(--brand-t)}
.pop-i small{display:block;color:var(--muted);margin-top:2px}
.pop button.pi{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 14px;cursor:pointer}
.pop button.pi:hover{background:var(--raised)}

/* page */
.page{padding-block:26px 90px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sec-h h1{font-size:28px;margin:0 0 2px}
.page-sub{color:var(--ink2);margin:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.rail{display:flex;flex-direction:column;gap:16px;min-width:0}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card.flat{box-shadow:none}
.card>h2:first-child{margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:14px 16px;min-width:0}
.stat span{font-size:13px;color:var(--muted);display:block}
.stat b{display:block;font-family:var(--fd);font-size:26px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--warn)}.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}

/* buttons / forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--brand);background:var(--brand);color:var(--on-brand);border-radius:9px;padding:9px 15px;font-weight:650;font-size:14px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:transparent;color:var(--brand-d)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.wide{width:100%}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:12px}
label.f>span.hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--hair);border-radius:9px;background:var(--surface);font-size:15px}
textarea{resize:vertical;min-height:70px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.err{color:var(--bad);font-size:13px;margin:4px 0 8px;min-height:1px}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;margin:6px 0 12px}
.chk input{margin-top:3px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:99px;background:var(--brand-t);color:var(--brand-d);white-space:nowrap}
.badge.warn{background:var(--warn-t);color:var(--warn)}.badge.ok{background:var(--ok-t);color:var(--ok)}
.badge.bad{background:var(--bad-t);color:var(--bad)}.badge.info{background:var(--info-t);color:var(--info)}
.badge.gray{background:var(--raised);color:var(--muted);border:1px solid var(--hair)}
.demo{font-size:11px;font-weight:650;padding:2px 8px;border-radius:99px;background:var(--wheat-t);color:var(--wheat);letter-spacing:.02em}

/* ledger table */
.tblw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--hair);white-space:nowrap}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--hair);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--raised)}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.you{color:var(--brand-d);font-weight:650}
.empty{text-align:center;padding:32px 12px;color:var(--ink2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--hair);background:var(--surface);border-radius:99px;padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* kv, timeline */
.kv{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px dashed var(--hair);font-size:14px}
.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right;font-weight:550}
.steps{list-style:none;margin:6px 0 0;padding:0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding-bottom:16px;position:relative;font-size:14px}
.steps li:not(:last-child)::before{content:"";position:absolute;left:11px;top:25px;bottom:-1px;width:2px;background:var(--hair)}
.steps li.done:not(:last-child)::before{background:var(--brand)}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--hair);flex:none;display:grid;place-items:center;background:var(--surface);color:var(--on-brand)}
.dot svg{width:13px;height:13px;stroke-width:3}
.done .dot{background:var(--brand);border-color:var(--brand)}
.cur .dot{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-t)}
.steps .t{font-weight:600}
.callout{border-radius:10px;padding:11px 13px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.callout svg{margin-top:2px}
.callout.lock{background:var(--brand-t);color:var(--brand-d)}
.callout.warn{background:var(--warn-t);color:var(--warn)}
.callout.bad{background:var(--bad-t);color:var(--bad)}
.callout.info{background:var(--info-t);color:var(--info)}
.callout.ok{background:var(--ok-t);color:var(--ok)}
.next{border:1.5px solid var(--brand);background:linear-gradient(0deg,var(--brand-t),var(--brand-t)),var(--surface)}
.next h2{margin-bottom:4px}
.hash{word-break:break-all;background:var(--raised);border:1px solid var(--hair);border-radius:8px;padding:8px 10px;margin:8px 0}
.demo-box{border:1.5px dashed var(--hair);border-radius:var(--r);padding:14px}
.demo-box h3{display:flex;gap:8px;align-items:center}

/* score ring + bars */
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-size:28px;font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--hair);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.bar i.w{background:var(--wheat)}
.meter{margin:10px 0}.meter .row{justify-content:space-between;font-size:13.5px;margin-bottom:4px;gap:6px}

/* activity */
.day{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.day:first-child{margin-top:0}
.act{display:flex;gap:10px;padding:6px 0;font-size:13.5px}
.act i{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:7px;flex:none}
.act i.s{background:var(--muted)}.act i.b{background:var(--wheat)}
.act time{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap;padding-left:8px}

/* ads / scheme */
.ad{border:1px dashed var(--hair);border-radius:var(--r);padding:14px;background:var(--raised);font-size:13.5px}
.ad .tag{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650}
.scheme{padding:14px 0;border-bottom:1px solid var(--hair)}
.scheme:last-child{border:0}
.scheme h3{margin:0}
.scheme .src{font-size:12.5px;color:var(--muted);margin-top:6px}
.scheme .src a{color:var(--info)}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.srcs a{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--hair);text-decoration:none;color:var(--info)}

/* plan */
.plans{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.plan{border:1.5px solid var(--hair);border-radius:var(--r);padding:20px;background:var(--surface)}
.plan.cur{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-t)}
.plan ul{list-style:none;padding:0;margin:12px 0 16px}
.plan li{display:flex;gap:8px;padding:5px 0;font-size:14px}
.plan li svg{color:var(--ok);margin-top:3px}
.plan .price{font-family:var(--fd);font-size:30px;font-weight:700}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--fb);fill:var(--muted);font-size:11px}
.chart .lbl{fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;z-index:5;transform:translate(-50%,-110%)}
.cw{position:relative}

/* modal */
.mback{position:fixed;inset:0;background:rgba(10,20,12,.55);z-index:80;display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow-y:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.big{max-width:680px}
.modal h2{font-size:20px;margin-bottom:12px}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.ai-card{border:1px solid var(--hair);background:var(--raised);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:13.5px}
.ai-card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:8px 0}
.ai-card dt{color:var(--muted)}.ai-card dd{margin:0;font-weight:600}
.fair li{display:flex;gap:8px;margin:6px 0;font-size:13.5px;list-style:none}
.fair{padding:0;margin:8px 0 0}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--hair);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:120;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* chat */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;gap:8px;align-items:center;background:var(--brand-d);color:#fff;border:0;border-radius:99px;padding:12px 18px;font-weight:650;box-shadow:0 6px 24px rgba(0,0,0,.25);cursor:pointer}
:root[data-theme="dark"] .fab{background:var(--brand);color:var(--on-brand)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fab{background:var(--brand);color:var(--on-brand)}}
.chatp{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:75;width:380px;max-width:calc(100vw - 32px);height:540px;max-height:calc(100vh - 120px);background:var(--surface);border:1px solid var(--hair);border-radius:16px;box-shadow:0 16px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
.chath{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:var(--brand-d);color:#fff;font-family:var(--fd);font-weight:650}
:root[data-theme="dark"] .chath{background:var(--brand-t);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chath{background:var(--brand-t);color:var(--ink)}}
.chath button{background:none;border:0;color:inherit;cursor:pointer}
.chatm{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--brand);color:var(--on-brand);border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--raised);border:1px solid var(--hair);border-bottom-left-radius:3px}
.chatq{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.chatq button{border:1px solid var(--hair);background:var(--surface);border-radius:99px;font-size:12.5px;padding:4px 11px;cursor:pointer;color:var(--ink2)}
.chati{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--hair)}
.chati input{margin:0}

/* landing */
.lp{margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)))}
.lp-in{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
.lp-top{display:flex;align-items:center;justify-content:space-between;height:64px}
.hero{background:var(--hero);color:var(--hero-ink);padding-bottom:56px}
.hero .brand{color:var(--hero-ink)}.hero .brand svg{color:#9bd6a5}
.hero-g{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:44px;align-items:center;padding-top:28px}
.hero h1{font-size:clamp(34px,5vw,56px);line-height:1.04;color:var(--hero-ink);margin-bottom:16px}
.hero .lede{font-size:18px;color:var(--hero-mute);max-width:520px}
.hero .btn.l{background:#eef5ea;border-color:#eef5ea;color:#1c3f26}
.hero .btn.o{background:transparent;color:var(--hero-ink);border-color:rgba(238,245,234,.45)}
.hero .fine{color:var(--hero-mute);font-size:13px;margin-top:14px}
.board{background:var(--surface);color:var(--ink);border-radius:14px;padding:6px 18px 14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.board-h{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--hair);font-size:13px;color:var(--muted)}
.board-h strong{color:var(--ink);font-family:var(--fd);font-size:15px}
.brow{padding:12px 0;border-bottom:1px solid var(--hair)}
.brow:last-child{border:0;padding-bottom:0}
.brow .t{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
.brow .s{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12.5px;margin:2px 0 8px}
.run{height:6px;border-radius:3px;background:var(--hair);overflow:hidden}
.run i{display:block;height:100%;background:var(--brand);border-radius:3px}
.run.warn i{background:var(--wheat)}.run.bad i{background:var(--bad)}
.lp-sec{padding:64px 0 0}
.lp-sec h2{font-size:clamp(26px,3.4vw,36px);margin-bottom:22px;max-width:640px}
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.tile{grid-column:span 2;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:22px}
.tile.w{grid-column:span 3}.tile.t{background:var(--brand-t);border-color:transparent}
.tile.d{background:var(--hero);border-color:transparent;color:var(--hero-ink)}.tile.d h3{color:var(--hero-ink)}.tile.d p{color:var(--hero-mute)}
.tile h3{font-size:18px}.tile p{color:var(--ink2);margin-bottom:10px}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:s}
.how div{border-top:3px solid var(--brand);padding-top:12px}
.how b{font-family:var(--fd);font-size:17px;display:block;margin-bottom:4px}
.how p{color:var(--ink2);font-size:14px}
.lp-cta{margin-top:64px;background:var(--brand-t);border-radius:16px;padding:40px 24px;text-align:center}
.lp-cta h2{margin:0 auto 18px;max-width:560px;font-size:clamp(24px,3vw,32px)}
.lp-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:28px 0 36px;color:var(--muted);font-size:13px}

/* auth */
.auth{max-width:520px;margin:0 auto;padding:30px 0 60px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 18px}
.role{border:1.5px solid var(--hair);border-radius:12px;padding:14px;background:var(--surface);cursor:pointer;text-align:left}
.role.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-t)}
.role b{display:block;font-family:var(--fd);font-size:16px}.role span{font-size:13px;color:var(--muted)}

/* tab bar */
.tabbar{display:none}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:1fr 1fr}
  .hero-g{grid-template-columns:minmax(0,1fr);gap:30px}
  .bento .tile,.bento .tile.w{grid-column:span 3}
  .how{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  .tnav{display:none}
  .tb{gap:8px}.tb-r{gap:7px}
  .planpill{display:none}
  .seg button{padding:5px 9px;font-size:12.5px}
  .page{padding-block:18px 100px}
  .sec-h h1{font-size:24px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--hair);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;font-size:11px;text-decoration:none;color:var(--muted);font-weight:600}
  .tabbar a.on{background:var(--brand-t);color:var(--brand-d)}
  .tabbar svg{width:20px;height:20px}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block}
  .tbl tr{padding:12px 4px;border-bottom:1px solid var(--hair)}
  .tbl td{padding:2px 0;border:0}
  .tbl td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:12px}
  .tbl .r{text-align:left}
  .plans,.fgrid{grid-template-columns:1fr}
  .bento .tile,.bento .tile.w{grid-column:span 6}
  .how{grid-template-columns:1fr}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom,0px));padding:11px 15px}

  .chatp{bottom:calc(76px + env(safe-area-inset-bottom,0px))}

}

const me=()=>BASE_PEOPLE[S.role==="buyer"?"B1":"F1"];
const other=c=>BASE_PEOPLE[S.role==="buyer"?c.farmerId:c.buyerId];
const person=id=>BASE_PEOPLE[id];
const mine=()=>S.contracts.filter(c=>c.farmerId===me().id||c.buyerId===me().id);
const byId=id=>S.contracts.find(c=>c.id===id);
const value=c=>c.final!=null?c.final:c.qty*c.price;
function status(c){
 if(c.dispute&&!c.dispute.outcome)return"disputed";
 if(c.stage>=6)return"completed";if(c.stage===0)return"awaiting";if(c.stage<=2)return"active";if(c.stage<=4)return"transit";return"delivered"}
const STAT={awaiting:["Awaiting signature","warn"],active:["Signed","info"],transit:["In transit","info"],delivered:["Delivered, verify","warn"],completed:["Completed","ok"],disputed:["Disputed","bad"]};
const sbadge=c=>{const[l,t]=STAT[status(c)];return`<span class="badge ${t}">${l}</span>`};
function next(c){
 if(c.dispute&&!c.dispute.outcome)return{who:"system",key:"dispute",label:"Mediation in progress"};
 switch(c.stage){
  case 0:{const p=[];if(!c.sig.f)p.push("farmer");if(!c.sig.b)p.push("buyer");return{who:p.includes(S.role)?S.role:p[0],key:"sign",label:"Sign the contract"}}
  case 1:return{who:"buyer",key:"fund",label:"Fund escrow"};
  case 2:return{who:"farmer",key:"dispatch",label:"Mark dispatched"};
  case 3:return{who:"system",key:"transit",label:"Transit update"};
  case 4:return{who:"buyer",key:"receive",label:"Receive and weigh"};
  case 5:return{who:"buyer",key:"confirm",label:"Confirm quality and release payment"};
 }return null}
const roleName=r=>r==="farmer"?"Farmer":r==="buyer"?"Buyer":"System";
function nextText(c){const n=next(c);if(!n)return'<span class="mute">Done</span>';
 if(n.who===S.role)return`<span class="you">Your turn: ${n.label}</span>`;
 if(n.who==="system")return`<span class="mute">${n.label}</span>`;
 return`<span class="mute">Waiting on ${other(c).name.split(" ")[0]}</span>`}
function dueText(c){
 const s=status(c);if(s==="completed")return`<span class="mute">Paid ${fshort(c.times[6])}</span>`;
 if(c.stage>=5)return`Pay by ${fshort(c.times[5]+c.payTerms*HR)}`;
 const n=dd(c.deliverBy);return`Deliver ${fshort(c.deliverBy)} <span class="mute">(${relDays(n)})</span>`}
function trustOf(p){
 const live=S.contracts.filter(c=>c.stage>=6&&(c.farmerId===p.id||c.buyerId===p.id)).length;
 let lost=0;S.contracts.forEach(c=>{const o=c.dispute&&c.dispute.outcome;if(!o)return;if(o.type==="release"&&c.buyerId===p.id)lost++;if(o.type==="refund"&&c.farmerId===p.id)lost++});
 const completed=p.stats.completed+live,onTime=p.stats.onTime;
 const parts={base:38,kyc:p.kyc?12:0,record:Math.min(completed,12)*2,punct:Math.round(onTime*.28),pen:lost*8};
 const score=clamp(parts.base+parts.kyc+parts.record+parts.punct-parts.pen,0,100);
 return{score,completed,onTime,lost,parts}}
function pushLog(c,who,text){c.log.push(L(Date.now(),who,text))}
function notify(to,text,link){S.notifs.unshift({id:Date.now()+Math.random(),to,ts:Date.now(),text,link,read:false})}
const otherRole=r=>r==="farmer"?"buyer":"farmer";
function act(id,key,as,p={}){
 const c=byId(id);if(!c)return;const n=Date.now(),v=c.qty*c.price,partyName=as==="system"?"System":as==="farmer"?person(c.farmerId).name:person(c.buyerId).name;
 const who=as==="farmer"?"F":as==="buyer"?"B":"sys";
 if(key==="sign"){c.sig[as==="farmer"?"f":"b"]=n;pushLog(c,who,`${partyName} signed the contract`);notify(otherRole(as),`${partyName} signed ${c.id}`,"contract-"+c.id);
  if(c.sig.f&&c.sig.b){c.lockedAt=n;c.lockedHash=sha256(terms(c));c.stage=1;c.times[1]=n;pushLog(c,"sys","Terms locked and fingerprinted. Neither side can edit them");notify("farmer",`${c.id} is locked. Buyer can now fund escrow`,"contract-"+c.id);notify("buyer",`${c.id} is locked. Fund escrow to start dispatch`,"contract-"+c.id)}}
 if(key==="fund"){c.escrow.held=v;c.stage=2;c.times[2]=n;pushLog(c,"B",`Escrow funded ${inr(v)} (simulated UPI)`);c.tx.push({ts:n,label:"Escrow funded by buyer",amt:v,dir:"in"});notify("farmer",`${c.id}: ${inr(v)} is secured in escrow. You can dispatch`,"contract-"+c.id)}
 if(key==="dispatch"){c.vehicle={no:p.vehicle,driver:p.driver};const adv=Math.round(v*c.advancePct/100);c.escrow.held-=adv;c.escrow.released+=adv;c.stage=3;c.times[3]=n;
  pushLog(c,"F",`Dispatched in ${p.vehicle}, driver ${p.driver}`);if(adv)c.tx.push({ts:n,label:`Advance ${c.advancePct}% released to farmer`,amt:adv,dir:"out"});notify("buyer",`${c.id} dispatched. Vehicle ${p.vehicle}`,"contract-"+c.id)}
 if(key==="transit"){c.stage=4;c.times[4]=n;pushLog(c,"sys","Vehicle crossed Kundli toll (GPS update)");notify("buyer",`${c.id} is in transit`,"contract-"+c.id)}
 if(key==="receive"){const w=clamp(+p.weighed||c.qty,0.1,c.qty*1.05);c.delivery={weighed:w,moisture:+p.moisture||11.4,at:n};c.final=Math.round(w*c.price);c.stage=5;c.times[5]=n;
  const have=c.escrow.held+c.escrow.released;if(c.final>have){const top=c.final-have;c.escrow.held+=top;c.tx.push({ts:n,label:"Escrow topped up for extra weight",amt:top,dir:"in"})}
  pushLog(c,"B",`Received and weighed: ${w} q, moisture ${c.delivery.moisture}%. Final value ${inr(c.final)}`);notify("farmer",`${c.id} delivered and weighed (${w} q). Buyer has ${c.payTerms}h to confirm`,"contract-"+c.id)}
 if(key==="confirm"){const pay=c.final-c.escrow.released,refund=Math.max(0,c.escrow.held-pay);c.escrow.released+=pay;c.escrow.held=0;c.escrow.refunded=refund;c.stage=6;c.times[6]=n;c.rated=p.rating||null;
  pushLog(c,as==="system"?"sys":"B",as==="system"?`Auto-released after ${c.payTerms}h with no objection`:"Confirmed quality. Payment released");
  c.tx.push({ts:n,label:"Final payment released to farmer",amt:pay,dir:"out"});if(refund>0)c.tx.push({ts:n,label:"Unused escrow returned to buyer",amt:refund,dir:"back"});
  notify("farmer",`${inr(pay)} credited for ${c.id} (UPI ref AB${String(n).slice(-8)})`,"contract-"+c.id)}
 if(key==="dispute"){c.dispute={by:as,reason:p.reason,note:p.note||"",opened:n,stage:0,outcome:null,evidence:["Contract fingerprint","Delivery log",...(c.delivery?["Weighbridge slip"]:[]),...(p.files||[])]};
  pushLog(c,who,`Raised an issue: ${p.reason}`);pushLog(c,"sys","Escrow frozen. Evidence packet compiled and attached");notify(otherRole(as),`${partyName} raised an issue on ${c.id}: ${p.reason}`,"contract-"+c.id)}
 if(key==="dstep"){if(c.dispute.stage<2){c.dispute.stage++;pushLog(c,"sys",c.dispute.stage===1?"Evidence review started":"Mediator assigned. Both sides asked for a response")}}
 if(key==="resolve"){const t=p.type,total=value(c);const ft=t==="release"?total:t==="partial"?Math.round(total*.9):c.escrow.released;
  const pay=clamp(ft-c.escrow.released,0,c.escrow.held),refund=c.escrow.held-pay;c.escrow.released+=pay;c.escrow.held=0;c.escrow.refunded=refund;
  c.dispute.outcome={type:t,amount:ft,at:n};c.stage=6;c.times[6]=n;
  const txt=t==="release"?"Resolved in favour of the farmer. Full payment released":t==="partial"?"Settled at a 10% price adjustment":"Resolved in favour of the buyer. Remaining escrow refunded";
  pushLog(c,"sys",txt);if(pay)c.tx.push({ts:n,label:"Settlement paid to farmer",amt:pay,dir:"out"});if(refund>0)c.tx.push({ts:n,label:"Escrow returned to buyer",amt:refund,dir:"back"});
  notify("farmer",`${c.id}: ${txt}`,"contract-"+c.id);notify("buyer",`${c.id}: ${txt}`,"contract-"+c.id)}
 save()}

/* fairness / price check (rule based) */
function priceCheck(crop,price,payHrs,advance,days){
 const C=CROPS[crop],mk=C.base,out=[];
 if(!price)return out;
 if(C.msp){const diff=price-C.msp;out.push(diff<0?{t:"warn",x:`${inr(-diff)} below the MSP of ${inr(C.msp)} (${C.season}). Check this price before you sign.`}:{t:"ok",x:`${inr(diff)} above the MSP of ${inr(C.msp)} (${C.season}).`})}
 else out.push({t:"info",x:`${crop} has no government MSP. Compare with mandi rates.`});
 const pct=(price-mk)/mk*100;
 out.push(Math.abs(pct)<=2?{t:"ok",x:`Within ${Math.abs(pct).toFixed(1)}% of today's mandi rate (${inr(mk)}).`}:pct<0?{t:"warn",x:`${Math.abs(pct).toFixed(1)}% below today's mandi rate of ${inr(mk)}.`}:{t:"ok",x:`${pct.toFixed(1)}% above today's mandi rate of ${inr(mk)}.`});
 if(payHrs>72)out.push({t:"warn",x:`Payment ${payHrs/24} days after delivery is slower than the usual 48 to 72 hours.`});
 if(advance===0)out.push({t:"info",x:"No advance. You carry the full cost until delivery."});
 if(days!=null&&days<3)out.push({t:"warn",x:"Delivery window is under 3 days. Late delivery is the most common dispute."});
 return out}
function buildSummary(c,lang){

 if(lang==="hi")return`अनुबंध ${c.id}। ${c.qty} क्विंटल ${CROPS[c.crop].hi}, ${c.price} रुपये प्रति क्विंटल, कुल ${value(c)} रुपये। खरीदार ${p.name}। डिलीवरी ${fdate(c.deliverBy)} तक। भुगतान डिलीवरी के ${c.payTerms} घंटे के भीतर, एस्क्रो में सुरक्षित।`;
 return`Contract ${c.id}. ${c.qty} quintal ${c.crop} at ${inr(c.price)} per quintal, total ${inr(value(c))}. Buyer ${p.name}. Deliver by ${fdate(c.deliverBy)}. Payment within ${c.payTerms} hours of delivery, held in escrow.`}

function cropIn(q){return Object.keys(CROPS).find(k=>q.toLowerCase().includes(k.toLowerCase().split(" ")[0]))}
function ask(q){
 const t=q.toLowerCase(),list=mine(),role=S.role,R={text:"",sources:[]};
 const m=t.match(/ab-?\s?(\d{4})/);
 if(m){const c=byId("AB-"+m[1]);if(c&&list.includes(c)){const n=next(c);R.text=`${c.id} is ${STAT[status(c)][0].toLowerCase()}. ${c.qty} q ${c.crop} at ${inr(c.price)}, value ${inr(value(c))}, with ${other(c).name}.\nNext step: ${n?(n.who===role?"your turn, "+n.label.toLowerCase():n.who==="system"?n.label.toLowerCase():"waiting on "+other(c).name):"none, it is complete"}.\nEscrow held ${inr(c.escrow.held)}, paid out ${inr(c.escrow.released)}.`;return R}
  R.text=`I can't find ${"AB-"+m[1]} in your contracts.`;return R}
 if(/escrow/.test(t)){R.text="Escrow means the buyer pays into a protected holding account before you dispatch. The money is released to you in two parts: an advance when you dispatch, and the balance when the buyer confirms quality (or automatically after the confirmation window). If there is a dispute, the money stays frozen until it is resolved.\nIn this prototype, payments are simulated.";return R}
 if(/msp|support price/.test(t)){const k=cropIn(t);if(k&&CROPS[k].msp){R.text=`The MSP I have for ${k} is ${inr(CROPS[k].msp)} per quintal (${CROPS[k].season}). Check PIB for the latest announcement before you rely on it.`}
  else if(k){R.text=`${k} has no government MSP. Use mandi rates as your reference.`}
  else R.text=`Reference MSPs in this demo: ${Object.entries(CROPS).filter(([,v])=>v.msp).map(([k,v])=>`${k} ${inr(v.msp)}`).join(", ")}.`;R.sources=[{t:"PIB: Rabi MSP 2026-27",u:MSP_SRC}];return R}
 if(/price|rate|mandi|market|sell/.test(t)){const k=cropIn(t)||(list[0]&&list[0].crop)||"Wheat",s=mseries(k),ch=(s[29]-s[0])/s[0]*100;
  R.text=`${k} is around ${inr(s[29])} per quintal at the mandi (demo data). That is ${ch>=0?"up":"down"} ${Math.abs(ch).toFixed(1)}% over 30 days.${CROPS[k].msp?` The MSP is ${inr(CROPS[k].msp)}.`:""}\nOpen the Market page for the chart.`;return R}
 if(/scheme|subsid|kisan|insurance|loan|credit/.test(t)){if(role==="buyer"){R.text="Scheme matching is for farmers. Switch to the Farmer view to see it.";return R}
  const ms=SCHEMES.filter(s=>s.rule({land:S.land})===1);R.text=`Based on your profile (${S.land} acres, ${S.state}) these look relevant: ${ms.map(s=>s.name).join(", ")}.\nConfirm eligibility on the official site before applying.`;R.sources=ms.slice(0,4).map(s=>({t:s.src,u:s.url}));return R}
 if(/dispute|issue|problem|reject|complain/.test(t)){R.text="Either side can report an issue once escrow is funded. Escrow freezes, and the contract fingerprint, delivery log and weighbridge slip are attached automatically. The case goes through evidence review and mediation. Outcomes are full release, a 10% price adjustment, or a refund of the remaining escrow.";return R}
 if(/trust|score|reliab/.test(t)){const x=trustOf(me());R.text=`Your trust score is ${x.score}/100: ${x.completed} completed contracts, ${x.onTime}% on time, ${x.lost} disputes lost. It rises with on-time completions and falls when a dispute goes against you.`;return R}
 if(/due|owe|payment|pay|money|receiv|escrow/.test(t)||/pending/.test(t)){
  const held=sum(list.map(c=>c.escrow.held)),rel=sum(list.map(c=>c.escrow.released)),open=list.filter(c=>status(c)!=="completed");
  R.text=role==="farmer"?`${inr(held)} is held in escrow for you and ${inr(rel)} has been paid out so far. ${open.length} contract${open.length===1?" is":"s are"} still open.`:`You have ${inr(held)} in escrow and have released ${inr(rel)}. ${open.length} contract${open.length===1?" is":"s are"} still open.`;return R}
 if(/next|todo|do now|action|attention|urgent|what should/.test(t)){const a=list.filter(c=>{const n=next(c);return n&&n.who===role});
  R.text=a.length?`You have ${a.length} thing${a.length>1?"s":""} to do:\n`+a.map(c=>`• ${c.id}: ${next(c).label} (${c.crop}, ${c.qty} q)`).join("\n"):"Nothing is waiting on you right now.";return R}
 if(/hello|hi\b|hey|namaste/.test(t)){R.text=`Namaste ${me().name.split(" ")[0]}. Ask me about your contracts, payments, mandi prices, MSP or schemes.`;return R}
 R.text="I can help with your contracts (try \"explain AB-1042\"), payments due, mandi prices, MSP, schemes, escrow and disputes. I summarise your own records and don't give legal, tax or financial advice.";return R}

  return`<g><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="3" fill="var(--brand)" fill-opacity="${v?1:.25}"><title>${i===0?"This week":"Week +"+i}: ${inr(v)}</title></rect>

  <text x="${(x+bw/2).toFixed(1)}" y="136" text-anchor="middle">${i===0?"Now":"+"+i+"w"}</text></g>`}).join("");

function healthCard(){
 const m=me(),t=trustOf(m),L=mine(),act=L.filter(c=>{const n=next(c);return n&&n.who===S.role&&status(c)!=="completed"}),dis=L.filter(c=>status(c)==="disputed");

function marketChart(crop,cp){
 const C=CROPS[crop],s=mseries(crop),W=640,H=280,ml=50,mr=14,mt=16,mb=28,vals=[...s];if(C.msp)vals.push(C.msp);if(cp)vals.push(cp);
 let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*.14||10;lo-=pad;hi+=pad;
 const raw=(hi-lo)/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),step=[1,2,2.5,5,10].map(m=>m*mag).find(x=>x>=raw);
 lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
 const X=i=>ml+i*(W-ml-mr)/29,Y=v=>mt+(hi-v)/(hi-lo)*(H-mt-mb);
 let grid="";for(let v=lo;v<=hi+1e-6;v+=step)grid+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--hair)" stroke-width="1"/><text x="${ml-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${Math.round(v).toLocaleString("en-IN")}</text>`;
 const xl=[0,7,14,21,29].map(i=>`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="${i===0?"start":i===29?"end":"middle"}">${fshort(Date.now()-(29-i)*DAY)}</text>`).join("");
 const line=s.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(""),area=`${line}L${X(29).toFixed(1)} ${Y(lo)}L${X(0).toFixed(1)} ${Y(lo)}Z`;
 const msp=C.msp?`<line x1="${ml}" x2="${W-mr}" y1="${Y(C.msp)}" y2="${Y(C.msp)}" stroke="var(--wheat)" stroke-width="1.5" stroke-dasharray="5 4"/><text class="lbl" x="${ml+6}" y="${Y(C.msp)-6}">MSP ${inr(C.msp)}</text>`:"";
 const cl=cp?`<line x1="${ml}" x2="${W-mr}" y1="${Y(cp)}" y2="${Y(cp)}" stroke="var(--info)" stroke-width="1.5" stroke-dasharray="2 3"/><text class="lbl" x="${W-mr-4}" y="${Y(cp)+(cp>=s[29]?-6:15)}" text-anchor="end">Your contract ${inr(cp)}</text>`:"";
 return`<svg class="chart" id="mchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${crop} price over the last 30 days">${grid}${xl}<path d="${area}" fill="var(--brand)" fill-opacity=".10"/>${msp}${cl}<path d="${line}" fill="none" stroke="var(--brand)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <line id="mcx" x1="0" x2="0" y1="${mt}" y2="${H-mb}" stroke="var(--muted)" stroke-width="1" class="hide"/><circle id="mcd" r="4.5" fill="var(--brand)" stroke="var(--surface)" stroke-width="2" cx="${X(29).toFixed(1)}" cy="${Y(s[29]).toFixed(1)}"/>
  <text class="lbl" x="${X(29)-8}" y="${Y(s[29])+20}" text-anchor="end">${inr(s[29])} today</text></svg>`}

 const el=$("#chat"),r=routeName();if(!S.role||["","welcome","login"].includes(r)){el.innerHTML="";return}
 if(!S.chat.open){el.innerHTML=`<button class="fab" data-act="chatopen" aria-label="Open Ask AgriBond">${ic("chat")}<span>Ask AgriBond</span></button>`;return}
 const Q=S.role==="farmer"?["What should I do next?","What payments are due?","Wheat MSP?","Which schemes fit me?"]:["What should I do next?","What payments are due?","Wheat price today?","How does escrow work?"];
 el.innerHTML=`<div class="chatp" role="dialog" aria-label="Ask AgriBond"><div class="chath"><span>Ask AgriBond</span><button data-act="chatclose" aria-label="Close">${ic("x")}</button></div>
 <div class="chatm" id="chatm">${S.chat.msgs.length?"":`<div class="msg a">Ask about your contracts, payments, mandi prices, MSP or schemes. I summarise your own records and don't give legal, tax or financial advice.<br><span class="demo" style="display:inline-block;margin-top:6px">Demo AI</span></div>`}
 ${S.chat.msgs.map(m=>`<div class="msg ${m.role==="user"?"u":"a"}">${esc(m.text)}${m.role!=="user"?`<div><span class="demo" style="display:inline-block;margin-top:6px">Demo AI</span></div>`:""}${m.sources&&m.sources.length?`<div class="srcs">${m.sources.map(s=>`<a href="${s.u}" target="_blank" rel="noopener">${esc(s.t)}</a>`).join("")}</div>`:""}</div>`).join("")}
 ${S.chat.busy?'<div class="msg a"><span class="spin"></span> Thinking…</div>':""}</div>
 <div class="chatq">${Q.map(q=>`<button data-act="askq" data-q="${esc(q)}">${q}</button>`).join("")}</div>
 <form class="chati" data-form="chat"><input type="text" id="chatin" placeholder="Ask a question" autocomplete="off" aria-label="Question"><button class="btn" type="submit" ${S.chat.busy?"disabled":""}>Send</button></form></div>`;
 const m=$("#chatm");if(m)m.scrollTop=m.scrollHeight;const i=$("#chatin");if(i&&window.innerWidth>720)i.focus()}
function sendChat(q){q=q.trim();if(!q||S.chat.busy)return;S.chat.msgs.push({role:"user",text:q});S.chat.busy=true;renderChat();
 setTimeout(()=>{const a=ask(q);S.chat.msgs.push({role:"a",text:a.text,sources:a.sources});S.chat.busy=false;renderChat()},650)}

/* ============ render ============ */
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove("show"),2400)}
function viewFor(r){
 if(r==="dashboard")return dashboard();if(r==="contracts")return contractsView();if(r==="market")return marketView();
 if(r==="schemes")return S.role==="farmer"?schemesView():null;if(r==="trust")return trustView();if(r==="plan")return planView();
 if(r.startsWith("contract-"))return detail(r.slice(9));return null}
function render(){
 const r=routeName(),pub=["welcome","login"];
 if(!r){location.hash=S.role?"dashboard":"welcome";return}
 if(!S.role&&!pub.includes(r)){location.hash="login";return}
 if(S.role&&r==="login"){location.hash="dashboard";return}
 const y=window.scrollY;let html;
 if(r==="welcome")html=landing();else if(r==="login")html=loginView();
 else{const v=viewFor(r);if(v==null){location.hash="dashboard";return}html=shell(r,v)}
 $("#app").innerHTML=html;renderChat();
 if(r===lastRoute)window.scrollTo(0,y);else window.scrollTo(0,0);lastRoute=r;
 if(r==="market")bindMarket()}
/* ============ events ============ */
const A={};
const simDefaults=(c,key,p)=>key==="dispatch"?{vehicle:"HR 55 CD 1280",driver:"Rakesh Yadav"}:key==="receive"?{weighed:c.qty,moisture:11.4}:key==="confirm"?{rating:4}:key==="resolve"?{type:p.type}:{};
A.open=el=>{location.hash="contract-"+el.dataset.id};
A.role=el=>{S.role=el.dataset.v;S.ui.bell=S.ui.menu=false;save();render()};
A.bell=()=>{S.ui.bell=!S.ui.bell;S.ui.menu=false;render()};
A.menu=()=>{S.ui.menu=!S.ui.menu;S.ui.bell=false;render()};
A.readall=()=>{S.notifs.forEach(n=>{if(n.to===S.role)n.read=true});save();render()};
A.readone=el=>{const n=S.notifs.find(x=>String(x.id)===el.dataset.id);if(n)n.read=true;S.ui.bell=false;save();render()};
A.reset=()=>{reset();location.hash==="#welcome"?render():location.hash="welcome";toast("Demo data reset")};
A.signout=()=>{S.role=null;S.ui.menu=false;save();location.hash==="#welcome"?render():location.hash="welcome"};
A.close=()=>closeModal();A.mback=()=>closeModal();
A.do=el=>{const c=byId(el.dataset.id);openModal(modalFor(el.dataset.key,c))};
A.report=el=>{openModal(modalFor("dispute",byId(el.dataset.id)))};
A.sim=el=>{const c=byId(el.dataset.id);act(c.id,el.dataset.key,el.dataset.as,simDefaults(c,el.dataset.key,el.dataset));toast("Demo step applied");render()};
A.verify=el=>{const c=byId(el.dataset.id),ok=sha256(terms(c))===c.lockedHash;$("#integ").innerHTML=`<div class="callout ${ok?"ok":"bad"}" style="margin-top:10px">${ic(ok?"check":"alert")}<div>${ok?"Fingerprint matches. The terms are exactly what both sides signed.":"Fingerprint does not match. The terms were changed after signing."}</div></div>`};
A.tamper=el=>{const c=byId(el.dataset.id),fake={...c,price:c.price+100},h=sha256(terms(fake));$("#integ").innerHTML=`<div class="callout bad" style="margin-top:10px">${ic("alert")}<div><b>Tamper test (nothing was saved).</b> If someone changed the price to ${inr(fake.price)}, the fingerprint would become <span class="mono">${h.slice(0,16)}…</span> instead of <span class="mono">${c.lockedHash.slice(0,16)}…</span>, and the contract would be flagged as altered.</div></div>`};
A.speak=el=>{const c=byId(el.dataset.id),hi=el.dataset.lang==="hi";if(!("speechSynthesis" in window)){toast("Read aloud is not supported on this device");return}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(buildSummary(c,el.dataset.lang));u.lang=hi?"hi-IN":"en-IN";speechSynthesis.speak(u);toast(hi?"सारांश सुनाया जा रहा है":"Reading the summary aloud")}catch(err){toast("Read aloud is not available here")}};
A.newc=el=>{const open=mine().filter(c=>status(c)!=="completed").length;
 if(S.plan==="free"&&open>=5){upgradeModal("The Free plan includes 5 open contracts. Close or complete one, or upgrade to Pro for unlimited contracts.");return}
 newContractModal({crop:el.dataset.crop})};
A.usescan=()=>{if(!_scan)return;const f=$("#newc");f.elements.crop.value=_scan.crop;f.elements.qty.value=_scan.qty;f.elements.price.value=_scan.price;f.elements.deliver.value=new Date(dAt(_scan.days)).toISOString().slice(0,10);f.elements.adv.value=String(_scan.adv);updFair();toast("Form filled. Check each value.")};
A.discover=()=>{S.ui.disc="loading";render();setTimeout(()=>{S.ui.disc=[{t:"myScheme (official portal)",u:"https://www.myscheme.gov.in/"},{t:"Dept. of Agriculture & Farmers Welfare",u:"https://agriwelfare.gov.in/"}];if(routeName()==="schemes")render()},1200)};
A.export=()=>exportModal();
A.copycsv=()=>{const b=$("#csvbox");b.select();(navigator.clipboard?navigator.clipboard.writeText(window._csv):Promise.reject()).then(()=>toast("CSV copied")).catch(()=>{try{document.execCommand("copy");toast("CSV copied")}catch(e){toast("Select the text and copy it")}})};
A.gopro=()=>{closeModal();location.hash="plan"};
A.setplan=el=>{S.plan=el.dataset.v;save();render();toast(S.plan==="pro"?"Pro plan on (demo)":"Back on the Free plan")};
A.cfilter=el=>{S.ui.cfilter=el.dataset.v;render()};
A.mcrop=el=>{S.ui.mcrop=el.dataset.v;render()};
A.pickrole=el=>{S.ui.login={role:el.dataset.v,sent:false};render()};
A.sendotp=()=>{S.ui.login.sent=true;render();toast("OTP sent (demo OTP: 4821)")};
A.start=el=>{S.ui.login={role:el.dataset.v,sent:false}};
A.enter=(el,e)=>{e.preventDefault();S.role=el.dataset.v;save();toast("Signed in to the demo account");location.hash==="#dashboard"?render():location.hash="dashboard"};
A.chatopen=()=>{S.chat.open=true;renderChat()};
A.chatclose=()=>{S.chat.open=false;renderChat()};
A.askq=el=>sendChat(el.dataset.q);

document.addEventListener("click",e=>{
 let closed=false;if(!e.target.closest(".pop-wrap")&&(S.ui.bell||S.ui.menu)){S.ui.bell=S.ui.menu=false;closed=true}
 const el=e.target.closest("[data-act]");
 if(el){const a=el.dataset.act;if(a==="mback"&&e.target!==el){if(closed)render();return}if(A[a]){A[a](el,e);return}}
 if(closed)render()});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&$("#modal").innerHTML)closeModal();
 if(e.key==="Enter"&&e.target.matches&&e.target.matches('tr[data-act="open"]'))A.open(e.target)});
document.addEventListener("input",e=>{
 if(e.target.id==="csearch"){S.ui.csearch=e.target.value;$("#ledgerWrap").innerHTML=ledger(filterList(sortUrgent(mine())));return}
 if(e.target.closest("#newc"))updFair()});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.matches&&t.matches("[data-scan]")&&t.files&&t.files[0]){
  const res=$("#scanres");if(!res)return;
  if(S.plan==="free"&&S.aiUsed>=3){res.innerHTML=`<div class="callout warn" style="margin-top:8px">${ic("alert")}<div>You have used all 3 free scans. <button type="button" class="btn sm" data-act="gopro">See Pro plan</button></div></div>`;return}
  res.innerHTML='<p class="small" style="margin:8px 0 0"><span class="spin"></span> Reading the document…</p>';const name=t.files[0].name;
  setTimeout(()=>{const r=$("#scanres");if(!r)return;S.aiUsed++;save();_scan=mockScan(name);
   r.innerHTML=`<div class="ai-card" style="background:var(--surface)"><div class="row"><b>Demo extraction, not real data</b><span class="demo">Demo AI</span></div><dl><dt>Crop</dt><dd>${_scan.crop}</dd><dt>Quantity</dt><dd>${_scan.qty} q</dd><dt>Price</dt><dd>${inr(_scan.price)} / q</dd><dt>Deliver in</dt><dd>${_scan.days} days</dd><dt>Confidence (demo)</dt><dd>${_scan.conf}%</dd></dl><p class="tiny mute">No AI reads your file in this prototype. These values are generated for demonstration. Edit every field before saving.</p><button type="button" class="btn sm" data-act="usescan">Use these values</button></div>`},900);return}
 if(t.id==="f_crop"){const f=$("#newc");f.elements.price.value=CROPS[t.value].base;updFair();return}
 if(t.dataset&&t.dataset.bind){const k=t.dataset.bind;if(k==="dfilter")S.ui.dfilter=t.value;else if(k==="land")S.land=Math.max(0,+t.value||0);else if(k==="state")S.state=t.value;save();render()}});

const FORMS={
 sign(f,d){const err=m=>$("#merr").textContent=m;if(d.otp!=="4821")return err("That OTP is wrong. Use the demo OTP 4821.");if(!d.agree)return err("Tick the box to confirm you have read the terms.");
  act(f.dataset.id,"sign",S.role);closeModal();toast(byId(f.dataset.id).stage>=1?"Both signed. Terms are locked":"You signed the contract");render()},
 fund(f){act(f.dataset.id,"fund","buyer");closeModal();toast("Escrow funded (simulated)");render()},
 dispatch(f,d){act(f.dataset.id,"dispatch","farmer",{vehicle:d.vehicle.toUpperCase(),driver:d.driver});closeModal();toast("Dispatched. Advance released");render()},
 receive(f,d){act(f.dataset.id,"receive","buyer",{weighed:d.weighed,moisture:d.moisture});closeModal();toast("Delivery recorded");render()},
 confirm(f,d){act(f.dataset.id,"confirm","buyer",{rating:+d.rating});closeModal();toast("Payment released (simulated)");render()},
 dispute(f,d){const files=[...(($("#evfile")||{}).files||[])].map(x=>x.name);act(f.dataset.id,"dispute",S.role,{reason:d.reason,note:d.note,files});closeModal();toast("Issue raised. Escrow is frozen");render()},
 newc(f,d){const err=m=>$("#merr").textContent=m,qty=+d.qty,price=+d.price;
  if(!(qty>0)||!(price>0))return err("Enter a quantity and price above zero.");const dl=new Date(d.deliver+"T00:00:00").getTime();if(isNaN(dl)||dl<sod(Date.now()))return err("Pick a delivery date that is today or later.");
  const farmer=S.role==="farmer",id="AB-"+(Math.max(...S.contracts.map(c=>+c.id.slice(3)))+1);
  const c={id,crop:d.crop,grade:d.grade,qty,price,farmerId:farmer?"F1":d.party,buyerId:farmer?d.party:"B1",deliverBy:dl,place:d.place||"To be agreed",quality:d.quality||"As agreed",advancePct:+d.adv,payTerms:+d.pay,created:Date.now(),sig:{f:null,b:null},stage:0,escrow:{held:0,released:0,refunded:0},times:{},vehicle:null,delivery:null,dispute:null,final:null,rated:null,log:[L(Date.now(),farmer?"F":"B",`${me().name} drafted this contract`)],tx:[]};
  S.contracts.unshift(c);notify(otherRole(S.role),`${me().name} proposed contract ${id}: ${qty} q ${d.crop}`,"contract-"+id);save();closeModal();toast("Draft created. Sign to lock it");location.hash="contract-"+id},
 login(f,d){if(d.otp!=="4821"){$("#merr").textContent="That OTP is wrong. Use the demo OTP 4821.";return}S.role=S.ui.login.role;save();toast("Verified (simulated). Welcome");location.hash="dashboard"},
 chat(f){const i=$("#chatin");sendChat(i.value)}
};
document.addEventListener("submit",e=>{const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();const fn=FORMS[f.dataset.form];if(fn)fn(f,Object.fromEntries(new FormData(f)))});

load();
window.addEventListener("hashchange",()=>{closeModal();render()});
render();
</script>
